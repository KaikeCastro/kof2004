plugins { id 'com.android.application' }
android {
    namespace 'br.com.brasilfighters'
    compileSdk 35
    defaultConfig { applicationId 'br.com.brasilfighters'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
    sourceSets { main.assets.srcDirs += layout.buildDirectory.dir('generated/gameAssets') }
}
def copyGame = tasks.register('copyGameAssets', Sync) {
    from('../..') { include 'index.html', 'controle.html', 'src/**', 'assets/**' }
    into layout.buildDirectory.dir('generated/gameAssets')
}
tasks.named('preBuild').configure { dependsOn(copyGame) }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
